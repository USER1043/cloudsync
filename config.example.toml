# Example CloudSync configuration. `cloudsync init` writes this file for you:
#   Windows: %AppData%\cloudsync\config.toml
#   Linux:   ~/.config/cloudsync/config.toml
# Every computer keeps its own copy, pointing at the same Drive folder.

# Extra rules for what to skip, written like .gitignore (see README).
ignore = [
  "*.iso",              # a file type, anywhere
  "/College/Old/",      # one folder, as a path from the synced folder
  "!keep-this.iso",     # exception to an earlier rule
]

# Skip files larger than this (KB, MB or GB). Leave out for no limit.
max_file_size = "500MB"

[[root]]
name   = "Documents"            # key in CloudSync's sync records; do not change later
remote = "CloudSync/Documents"  # folder in My Drive
path   = "~/Documents/Synced"   # folder on this computer (~ is your home folder)

# More folders can be synced by adding more [[root]] sections, each with its
# own name and Drive folder.
